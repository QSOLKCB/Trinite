name: Reports-only task audit and CUDA observation preservation
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: music-task-audit-result-${{ github.ref }}
  cancel-in-progress: true
jobs:
  report-consistency:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    env:
      PYTHONPATH: src:scripts
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - name: Verify preserved audit and bounded observation receipts
        run: |
          python -I -B scripts/check_music_task_audit_result.py
          python -B -m unittest discover -s tests/music_task_audit_result_v1 -v
          python -O -B -m unittest discover -s tests/music_task_audit_result_v1 -v
      - name: Historical audit and diagnostic software doubles only
        run: |
          python -B -m unittest discover -s tests/music_task_audit_v1 -v
          python -B -m unittest discover -s tests/cuda_availability_v1 -v
          python -I -B scripts/check_music_robustness_result.py
          python -I -B scripts/check_music_placement_result.py
          python -I -B scripts/check_music_pitch_result.py
          python -I -B scripts/check_frozen_music_eval_result.py
          git diff --exit-code
      # Standard library only. Never run the actual CUDA diagnostic or nvidia-smi.
