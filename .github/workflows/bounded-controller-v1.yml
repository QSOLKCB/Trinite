name: Bounded external controller v1
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  bounded-controller-v1:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Explicit Rust baseline
        run: rustup toolchain install 1.90.0 --profile minimal && rustup default 1.90.0
      - name: Source-bound native admission
        run: |
          python3 scripts/run_omi_module_v1.py build
          python3 scripts/run_qutrit_conformance_v1.py build
      - name: Controller contracts, normal and optimized
        run: |
          PYTHONPATH=src:scripts python3 -B -m unittest discover -s tests/bounded_controller_v1 -v
          PYTHONPATH=src:scripts python3 -B -O -m unittest discover -s tests/bounded_controller_v1 -v
