name: Final-forward export conformance

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/forward_export/**'
      - 'tests/test_forward_export_boundaries.py'
      - 'requirements.lock'
      - 'pyproject.toml'
      - '.github/workflows/forward-export.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  final-forward-export:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      PYTHONPATH: src
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Acquire the exact canonical CPU dependencies
        run: |
          python -m pip install --require-hashes --no-deps -r requirements.lock
          python -m pip check
      - name: Standard-library import and dependency boundaries
        run: python -S -m unittest discover -s tests -p test_forward_export_boundaries.py -v
      - name: Immutable export, rejection and exact forward-oracle parity
        run: python -m unittest discover -s tests/forward_export -p test_encoder.py -v
      - name: Real installed-wheel export with relocated source closure
        run: python -m unittest discover -s tests/forward_export -p test_installed_wheel.py -v
