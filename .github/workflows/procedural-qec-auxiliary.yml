name: Non-displacing auxiliary engineering conformance
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qec-auxiliary-${{ github.ref }}
  cancel-in-progress: true

jobs:
  historical-mapping-and-native-replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PYTHONPATH: src
      PYTHONDONTWRITEBYTECODE: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      TRINITE_HISTORICAL_SOURCE: ${{ github.workspace }}/historical-producer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: 93522bf8f18fe38970ceafdd2ace792f8922c382
          path: historical-producer
          persist-credentials: false
          sparse-checkout: src
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Real historical admission, mapping, cadence and transport boundaries
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p test_procedural_qec_auxiliary.py -v
          python -m unittest discover -s tests -p test_auxiliary_spec.py -v
          python -m unittest discover -s tests/procedural_qec_auxiliary_data -v
          python -m unittest discover -s tests -p test_procedural_auxiliary_archive.py -v
      - name: Acquire exact CPU conformance dependencies
        run: |
          python -m pip install --require-hashes --no-deps -r requirements.lock
          python -m pip check
      - name: Tiny native updates, odd/even restart and three complete replay passes
        run: |
          set -euo pipefail
          python -m unittest discover -s tests/procedural_qec_auxiliary -v
