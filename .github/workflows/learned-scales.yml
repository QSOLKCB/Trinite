name: Learned ternary scale engineering conformance

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: learned-scales-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pinned-cpu-learned-scales:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    env:
      PYTHONPATH: src:scripts
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Acquire hash-locked CPU dependencies
        run: |
          python -m pip install --require-hashes --no-deps -r requirements.lock
          python -m pip check
      - name: Analytic scale gradients and full tiny optimizer replay
        run: python -m unittest discover -s tests/learned_scales_v1 -v
      - name: Fresh source-bound receipt and actual replay
        run: |
          receipt="$RUNNER_TEMP/learned-scales-report.json"
          identity=$(python scripts/check_learned_scales.py --output "$receipt")
          python scripts/check_learned_scales.py --output "$receipt" --verify-only --expected-identity "$identity"
