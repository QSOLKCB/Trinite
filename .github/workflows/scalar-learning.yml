name: Manual matched scalar-learning evaluation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scalar-learning:
    runs-on: ubuntu-24.04
    # 27 x 600s + evaluation 1200s + verification 1200s = 310m;
    # 50m remain for setup and retention within the hosted six-hour limit.
    timeout-minutes: 360
    env:
      PYTHONPATH: src
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Acquire hash-locked CPU dependencies
        run: |
          python -m pip install --require-hashes --no-deps -r requirements.lock
          python -m pip check
      - name: Freeze current matched request
        run: python scripts/run_scalar_learning.py --freeze-request "$RUNNER_TEMP/scalar-learning-request.json" > "$RUNNER_TEMP/scalar-learning-freeze.json"
      - name: Retain matched training and gated held-out outcomes
        run: |
          SCALAR_REQUEST_ID=$(python -c 'import json,os; print(json.load(open(os.environ["RUNNER_TEMP"]+"/scalar-learning-freeze.json"))["request_identity"])')
          python scripts/run_scalar_learning.py --request "$RUNNER_TEMP/scalar-learning-request.json" --request-identity "$SCALAR_REQUEST_ID" --output "$RUNNER_TEMP/scalar-learning"
      - name: Retain completed, blocked and failed outcomes
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: scalar-learning-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/scalar-learning
            ${{ runner.temp }}/scalar-learning-request.json
            ${{ runner.temp }}/scalar-learning-freeze.json
          if-no-files-found: warn
          retention-days: 14
