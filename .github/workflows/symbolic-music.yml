name: Symbolic music conformance
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: symbolic-music-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - name: Exact symbolic and isolated optional-render contracts (stdlib only)
        run: |
          PYTHONPATH=src python -B -m unittest discover -s tests/music_v1 -v
          PYTHONPATH=src python -O -B -m unittest discover -s tests/music_v1 -v
      - name: Fresh source-bound corpus replay, no model or training
        run: |
          export PYTHONPATH=src
          commitment=$(python -B scripts/run_symbolic_music.py generate "$RUNNER_TEMP/music-v1")
          python -B scripts/run_symbolic_music.py verify "$RUNNER_TEMP/music-v1" --manifest-sha256 "$commitment"
          git diff --exit-code
