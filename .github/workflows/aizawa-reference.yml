name: Aizawa geometry reference conformance

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aizawa-reference-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reference:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    env:
      PYTHONPATH: src:scripts
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Freeze protocol and exercise true pinned Trinite geometry reference
        run: |
          python -m unittest discover -s tests/aizawa_reference -v
          python -m unittest discover -s tests -p test_aizawa_reference_contract.py -v
          python -S scripts/run_aizawa_reference.py --freeze-request --output "$RUNNER_TEMP/aizawa-request.json"
