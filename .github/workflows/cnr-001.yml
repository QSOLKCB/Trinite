  historical-v3-replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONPATH: src
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: c9f4399eca3bb380136321453ff2c6222f0bbaec
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Replay unchanged v3 archive with its original producer
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --require-hashes --no-deps -r requirements.connectome.lock
          python - <<'PYCODE' 2>&1 | tee "$RUNNER_TEMP/cnr-historical-v3.log"
          import hashlib, importlib.util, os, tarfile
          from pathlib import Path
          from trinite.contracts import identity, json_bytes
          packet = Path("fixtures/cnr-001-evidence/cnr001-v3.tar.gz").read_bytes()
          assert hashlib.sha256(packet).hexdigest() == "fcec1f268a3985aeb921899d2cfcd8886ec91d53598faa6184761eb800a5ef5a"
          spec = importlib.util.spec_from_file_location("cnr_v3", "scripts/run_cnr001.py")
          runner = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(runner)
          with tarfile.open("fixtures/cnr-001-evidence/cnr001-v3.tar.gz", "r:gz") as archive:
              request = archive.extractfile("v3/cnr-request.json").read()
              analysis = archive.extractfile("v3/cnr-analysis.json").read()
              receipt = archive.extractfile("v3/cnr-verification.json").read()
          root = Path(os.environ["RUNNER_TEMP"])
          rpath, apath = root / "v3-request.json", root / "v3-analysis.json"
          rpath.write_bytes(request)
          apath.write_bytes(analysis)
          got = runner.verify(rpath, identity(request), apath, identity(analysis))
          assert json_bytes(got) == receipt
          assert rpath.read_bytes() == request and apath.read_bytes() == analysis
          print("Original v3 request, analysis and verification receipt replay exactly; inputs unchanged.")
          PYCODE
      - name: Retain historical replay log including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cnr-001-historical-v3-replay
          path: ${{ runner.temp }}/cnr-historical-v3.log
          if-no-files-found: warn
