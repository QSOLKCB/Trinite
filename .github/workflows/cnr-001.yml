name: CNR-001 connectome and ETQ comparison

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cnr-001-${{ github.ref }}
  cancel-in-progress: true

jobs:
  retrospective-graph-comparison:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONPATH: src
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Acquire hash-locked isolated biological Parquet reader
        run: |
          python -m pip install --require-hashes --no-deps -r requirements.connectome.lock
          python -c "import importlib.metadata; assert importlib.metadata.version('pyarrow') == '21.0.0'"
      - name: Build and install wheel at the package boundary
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install setuptools==84.0.0
          python -m unittest discover -s tests/packaging -v 2>&1 | tee "$RUNNER_TEMP/cnr-wheel-tests.log"
      - name: Require immutable v7, v8, v9 and v10 packets and independent sidecars
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PYCODE'
          import hashlib
          from pathlib import Path
          root = Path("fixtures/cnr-001-evidence")
          for version, expected in (
              ("v7", "03327a365b76474bfaf0956eb06766cabdf9de02e5ca1162c0c1474f9d893288"),
              ("v8", "718e5fec4674ab615b4162a956500b0bc245e25f15153770a5bfa4e6f7d72b42"),
              ("v9", "44c5dc8906c9a747498288a027aab907998b03ca0d508437b6a53b1b8d2aa59d"),
              ("v10", "6059a5f97f7d6783e7d489c6787205d7c0402647173d2e96e5cc7321a630fc38"),
          ):
              packet = root / ("cnr001-" + version + ".tar.gz")
              sidecar = root / ("cnr001-" + version + ".sha256")
              if (hashlib.sha256(packet.read_bytes()).hexdigest() != expected
                      or sidecar.read_bytes() != (expected + "  " + packet.name + "\n").encode("ascii")):
                  raise RuntimeError("immutable " + version + " archive/sidecar changed")
          print("Historical v7/v8/v9/v10 bytes and sidecars preserved; never regenerate them.")
          PYCODE
      # Only the missing-packet bootstrap emits candidate bytes; the following
      # strict tests still fail until the independently committed v11 packet and
      # its externally recorded checksum exist. No historical bytes are altered.
      - name: Emit prospectively source-bound v11 candidate when missing
        shell: bash
        run: |
          set -euo pipefail
          if [ -e fixtures/cnr-001-evidence/cnr001-v11.tar.gz ]; then
            echo 'v11 evidence packet already retained; test its full exact replay.'
          else
            python - <<'PY'
          import base64, gzip, hashlib, io, json, os, tarfile, tempfile
          from pathlib import Path
          from trinite.contracts import identity, json_bytes, parse_json
          from scripts import run_cnr001 as runner

          def sha(raw):
              return hashlib.sha256(raw).hexdigest()

          root = Path(tempfile.mkdtemp(prefix="cnr001-v11-candidate-"))
          req, analysis = root/"cnr-request.json", root/"cnr-analysis.json"
          frozen = runner.freeze(req)
          ran = runner.run(req, frozen["request_identity"], analysis)
          before = (req.read_bytes(), analysis.read_bytes())
          checked = runner.verify(req, frozen["request_identity"], analysis,
                                  ran["analysis_identity"])
          if (checked["status"] != "passed" or not checked["read_only"]
                  or before != (req.read_bytes(), analysis.read_bytes())):
              raise RuntimeError("new CNR v11 candidate failed authentic source-bound replay")
          # Inspect the actual mismatch, not an inferred or silently resealed ID.
          with tarfile.open("fixtures/cnr-001-evidence/cnr001-v10.tar.gz", "r:gz") as tar:
              archived = parse_json(tar.extractfile("v10/cnr-request.json").read(), canonical=True)
          fresh = parse_json(req.read_bytes(), canonical=True)
          if set(fresh) != set(archived):
              raise RuntimeError("CNR request fields changed")
          for key in archived:
              if key != "source" and fresh[key] != archived[key]:
                  raise RuntimeError("CNR protocol/data field changed: " + key)
          oldsource, newsource = archived["source"], fresh["source"]
          changed = {
              "added": sorted(set(newsource)-set(oldsource)),
              "removed": sorted(set(oldsource)-set(newsource)),
              "modified": sorted(k for k in set(oldsource)&set(newsource)
                                 if oldsource[k] != newsource[k]),
          }
          print("CNR_V11_CHANGED_SOURCE_KEYS:" + json.dumps(changed, sort_keys=True))
          if changed != {
              "added": ["src/trinite/procedural_qec_auxiliary/__init__.py",
                        "src/trinite/procedural_qec_auxiliary/archive.py",
                        "src/trinite/procedural_qec_auxiliary/experiment.py",
                        "src/trinite/procedural_qec_auxiliary/inputs.py",
                        "src/trinite/procedural_qec_auxiliary/scheduler.py",
                        "src/trinite/procedural_qec_auxiliary/spec.py"],
              "removed": [], "modified": [".github/workflows/cnr-001.yml"],
          }:
              raise RuntimeError("unexpected source change beyond additive procedural auxiliary package and fixed workflow")
          parent_v10 = Path("fixtures/cnr-001-evidence/cnr001-v10.tar.gz").read_bytes()
          if sha(parent_v10) != "6059a5f97f7d6783e7d489c6787205d7c0402647173d2e96e5cc7321a630fc38":
              raise RuntimeError("historical parent archive changed")
          items = {
              "v11/cnr-request.json": req.read_bytes(),
              "v11/cnr-analysis.json": analysis.read_bytes(),
              "v11/cnr-freeze-receipt.json": json_bytes(frozen),
              "v11/cnr-run-receipt.json": json_bytes(ran),
              "v11/cnr-verification.json": json_bytes(checked),
          }
          manifest = {
              "schema": "trinite.cnr-001-evidence-archive.v11",
              "parent_v10_sha256": sha(parent_v10),
              "source_procedure": "unchanged CNR v4 protocol, new source-bound producer",
              "source_delta": changed,
              "request_identity": frozen["request_identity"],
              "analysis_identity": ran["analysis_identity"],
              "entries": {name: {"bytes": len(raw), "sha256": sha(raw)}
                          for name, raw in sorted(items.items())},
          }
          items["MANIFEST.json"] = json_bytes(manifest)
          out = io.BytesIO()
          with gzip.GzipFile(fileobj=out,mode="wb",mtime=0,filename="") as gz:
              with tarfile.open(fileobj=gz,mode="w|") as tar:
                  for name, raw in sorted(items.items()):
                      member = tarfile.TarInfo(name)
                      member.size=len(raw); member.mtime=0
                      member.mode=0o644; member.uid=member.gid=0
                      member.uname=member.gname=""
                      tar.addfile(member, io.BytesIO(raw))
          candidate = out.getvalue()
          print("CNR_V11_ARCHIVE_SHA256:" + sha(candidate))
          print("CNR_V11_ARCHIVE_BYTES:" + str(len(candidate)))
          print("CNR_V11_ARCHIVE_BASE64:" + base64.b64encode(candidate).decode("ascii"))
          PY
          fi
      - name: Run bounded native-baseline/CNR experiment and verify exact replay
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_cnr001.py' -v 2>&1 | tee "$RUNNER_TEMP/cnr-standardlib-tests.log"
          python -m unittest discover -s tests/cnr -v 2>&1 | tee "$RUNNER_TEMP/cnr-real-data-tests.log"
          python scripts/run_cnr001.py --freeze-request "$RUNNER_TEMP/cnr-request.json" > "$RUNNER_TEMP/cnr-freeze-receipt.json" 2> "$RUNNER_TEMP/cnr-freeze.log"
          REQUEST=$(python -c "import json,os; print(json.load(open(os.environ['RUNNER_TEMP']+'/cnr-freeze-receipt.json'))['request_identity'])")
          python scripts/run_cnr001.py --run --request "$RUNNER_TEMP/cnr-request.json" --request-identity "$REQUEST" --output "$RUNNER_TEMP/cnr-analysis.json" > "$RUNNER_TEMP/cnr-run-receipt.json" 2> "$RUNNER_TEMP/cnr-run.log"
          ANALYSIS=$(python -c "import json,os; print(json.load(open(os.environ['RUNNER_TEMP']+'/cnr-run-receipt.json'))['analysis_identity'])")
          python scripts/run_cnr001.py --verify-only --request "$RUNNER_TEMP/cnr-request.json" --request-identity "$REQUEST" --output "$RUNNER_TEMP/cnr-analysis.json" --analysis-identity "$ANALYSIS" > "$RUNNER_TEMP/cnr-verification.json" 2> "$RUNNER_TEMP/cnr-verification.log"
          python - <<'PY'
          import json, os
          with open(os.environ['RUNNER_TEMP']+'/cnr-analysis.json') as stream: report=json.load(stream)
          print('CNR-001 retrospective results; not independent model generalization:')
          for layer, record in report['layers'].items():
              print(layer)
              for name, arm in record['arms'].items():
                  print(f"  {name:35s}: hops={arm['graph_hops_sum']:3d}; adjacent={arm['same_or_adjacent']}/8; collisions={arm['anchor_collisions']}")
          print('ETQ-303 full walk/event:',report['graph_provenance']['etq_diagnostics'])
          print('v0.1.0 baseline:',report['baseline'])
          PY
      - name: Verify current source-bound v11 packet against exact fresh native replay
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os, re, runpy, tarfile
          from pathlib import Path
          from trinite.contracts import json_bytes, parse_json
          from trinite.cnr001 import core
          def sha(raw): return hashlib.sha256(raw).hexdigest()

          root=Path("fixtures/cnr-001-evidence")
          parent=(root/"cnr001-v10.tar.gz").read_bytes()
          if sha(parent) != "6059a5f97f7d6783e7d489c6787205d7c0402647173d2e96e5cc7321a630fc38":
              raise RuntimeError("immutable v10 archive changed")
          packet=root/"cnr001-v11.tar.gz"
          # These independently captured constants live outside the CNR source
          # receipt, so retention never changes this finalized workflow.
          anchors=runpy.run_path("tests/test_cnr001.py")
          expected_sha, expected_bytes=anchors["V11_SHA256"], anchors["V11_BYTES"]
          if (type(expected_sha) is not str or re.fullmatch(r"[a-f0-9]{64}", expected_sha) is None
                  or type(expected_bytes) is not int or expected_bytes <= 0):
              raise RuntimeError("v11 external archive identity/length is not captured")
          if sha(packet.read_bytes())!=expected_sha or len(packet.read_bytes())!=expected_bytes:
              raise RuntimeError("v11 archive differs from the independent capture")
          recorded=(root/"cnr001-v11.sha256").read_text("ascii").strip().split()
          if (len(recorded)!=2 or re.fullmatch(r"[a-f0-9]{64}", recorded[0]) is None
                  or recorded[0]!=expected_sha
                  or recorded[1]!="cnr001-v11.tar.gz"
                  or (root/"cnr001-v11.sha256").read_bytes() != (recorded[0]+"  "+packet.name+"\n").encode("ascii")
                  or sha(packet.read_bytes())!=recorded[0]):
              raise RuntimeError("missing or mismatched independent v11 commitment")
          with tarfile.open(packet,"r:gz") as archive:
              members=archive.getmembers()
              if len(members)!=6 or any(not m.isfile() for m in members) or len({m.name for m in members})!=6:
                  raise RuntimeError("wrong v11 source-bound packet inventory")
              raw={m.name:archive.extractfile(m).read() for m in members}
          files=("cnr-request.json","cnr-analysis.json","cnr-freeze-receipt.json",
                 "cnr-run-receipt.json","cnr-verification.json")
          expected={"MANIFEST.json"}|{"v11/"+n for n in files}
          if set(raw)!=expected: raise RuntimeError("missing v11 packet members")
          manifest=parse_json(raw["MANIFEST.json"], canonical=True)
          if (raw["MANIFEST.json"]!=json_bytes(manifest)
                  or manifest["schema"]!="trinite.cnr-001-evidence-archive.v11"
                  or manifest["parent_v10_sha256"]!=sha(parent)
                  or set(manifest["entries"])!=expected-{"MANIFEST.json"}):
              raise RuntimeError("noncanonical/missing v11 historical ancestry")
          for name,attrs in manifest["entries"].items():
              if attrs!={"bytes":len(raw[name]),"sha256":sha(raw[name])}:
                  raise RuntimeError("v11 member digest differs: "+name)
          if (manifest["request_identity"]!="sha256:"+sha(raw["v11/cnr-request.json"])
                  or manifest["analysis_identity"]!="sha256:"+sha(raw["v11/cnr-analysis.json"])):
              raise RuntimeError("v11 independently committed identities differ")
          with tarfile.open(root/"cnr001-v10.tar.gz", "r:gz") as archive:
              previous=parse_json(archive.extractfile("v10/cnr-request.json").read(), canonical=True)
          request=parse_json(raw["v11/cnr-request.json"], canonical=True)
          if set(request)!=set(previous):
              raise RuntimeError("v11 request fields differ from historical v10")
          for key in previous:
              if key!="source" and request[key]!=previous[key]:
                  raise RuntimeError("v11 protocol/data field changed: "+key)
          oldsource, newsource=previous["source"], request["source"]
          delta={"added":sorted(set(newsource)-set(oldsource)),
                 "removed":sorted(set(oldsource)-set(newsource)),
                 "modified":sorted(k for k in set(oldsource)&set(newsource)
                                   if oldsource[k]!=newsource[k])}
          expected_delta={"added":["src/trinite/procedural_qec_auxiliary/__init__.py",
                                   "src/trinite/procedural_qec_auxiliary/archive.py",
                                   "src/trinite/procedural_qec_auxiliary/experiment.py",
                                   "src/trinite/procedural_qec_auxiliary/inputs.py",
                                   "src/trinite/procedural_qec_auxiliary/scheduler.py",
                                   "src/trinite/procedural_qec_auxiliary/spec.py"],
                          "removed":[], "modified":[".github/workflows/cnr-001.yml"]}
          if (delta!=expected_delta or manifest["source_delta"]!=delta
                  or newsource!=core.source_receipt()):
              raise RuntimeError("v11 complete source receipt or exact source delta differs")
          current=Path(os.environ["RUNNER_TEMP"])
          for name in files:
              if raw["v11/"+name]!=(current/name).read_bytes():
                  raise RuntimeError("v11 exact current producer replay mismatch: "+name)
          print("v11 packet exactly reproduces current source-bound request, result, and verifier; immutable v10 preserved.")
          PY
      - name: Retain all research results, including failure logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cnr-001-retrospective-reports
          path: |
            ${{ runner.temp }}/cnr-*.json
            ${{ runner.temp }}/cnr-*.log
          if-no-files-found: warn
          retention-days: 90

  historical-v6-replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: current
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: e28fd69f50bf6fccf8951a20ab4397238c76ba15
          path: v6-producer
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install original hash-locked authentic CNR reader
        working-directory: v6-producer
        run: python -m pip install --require-hashes --no-deps -r requirements.connectome.lock
      - name: Replay authenticated v6 request and analysis with exact original producer
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os, pathlib, subprocess, sys, tarfile, tempfile
          def sha(raw): return hashlib.sha256(raw).hexdigest()
          packet=pathlib.Path("current/fixtures/cnr-001-evidence/cnr001-v6.tar.gz")
          if sha(packet.read_bytes())!="86cb1be634f41cceabb7f1b49c5b5d4803b5a182ca04167b27ff96aea36a0aa4":
              raise RuntimeError("v6 external archive identity differs")
          with tarfile.open(packet,"r:gz") as tar:
              members=tar.getmembers()
              if len(members)!=6 or any(not x.isfile() for x in members) or len({x.name for x in members})!=6:
                  raise RuntimeError("invalid historical v6 file inventory")
              retained={x.name:tar.extractfile(x).read() for x in members}
          names={"MANIFEST.json","v6/cnr-request.json","v6/cnr-analysis.json",
                 "v6/cnr-freeze-receipt.json","v6/cnr-run-receipt.json","v6/cnr-verification.json"}
          if set(retained)!=names: raise RuntimeError("historical v6 members missing")
          from pathlib import Path
          sys.path.insert(0,str(Path("v6-producer/src").resolve()))
          from trinite.contracts import json_bytes
          manifest=json.loads(retained["MANIFEST.json"])
          if (retained["MANIFEST.json"]!=json_bytes(manifest)
                  or manifest["schema"]!="trinite.cnr-001-evidence-archive.v6"
                  or manifest["parent_v5_sha256"]!="03e735f1101d26f935134ff9fe3f95fce43d6e40b2a03e0f9de0136305ee2144"
                  or set(manifest["entries"])!=names-{"MANIFEST.json"}):
              raise RuntimeError("historical v6 manifest or parent commitment invalid")
          for name,attrs in manifest["entries"].items():
              if attrs!={"bytes":len(retained[name]),"sha256":sha(retained[name])}:
                  raise RuntimeError("historical v6 member differs: "+name)
          req=retained["v6/cnr-request.json"]
          analysis=retained["v6/cnr-analysis.json"]
          rid="sha256:"+sha(req)
          aid="sha256:"+sha(analysis)
          if manifest["request_identity"]!=rid or manifest["analysis_identity"]!=aid:
              raise RuntimeError("historical v6 request/analysis identities differ")
          with tempfile.TemporaryDirectory() as tmp:
              rp=pathlib.Path(tmp)/"request.json"
              ap=pathlib.Path(tmp)/"analysis.json"
              rp.write_bytes(req)
              ap.write_bytes(analysis)
              producer=pathlib.Path("v6-producer").resolve()
              env=dict(os.environ,PYTHONPATH=str(producer/"src"))
              args=[sys.executable,"scripts/run_cnr001.py","--verify-only",
                    "--request",str(rp),"--request-identity",rid,
                    "--output",str(ap),"--analysis-identity",aid]
              checked=subprocess.run(args,cwd=producer,env=env,capture_output=True,timeout=240)
              if checked.returncode!=0:
                  raise RuntimeError("original v6 native replay failed: "+checked.stderr.decode(errors="replace")[-1600:])
              if checked.stdout!=retained["v6/cnr-verification.json"]:
                  raise RuntimeError("fresh v6 verifier receipt differs from archived receipt")
              if rp.read_bytes()!=req or ap.read_bytes()!=analysis:
                  raise RuntimeError("v6 verification mutated original run bytes")
          print("Full v6 verifier executed against pinned producer e28fd69; original request, analysis, receipt and archive identities match.")
          PY

  historical-v7-replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: current
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: bda46a5a411bd1b12b0a12da7a816f4d23bf161a
          path: v7-producer
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install original hash-locked authentic CNR reader
        working-directory: v7-producer
        run: python -m pip install --require-hashes --no-deps -r requirements.connectome.lock
      - name: Replay authenticated v7 request and analysis with exact original producer
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os, pathlib, subprocess, sys, tarfile, tempfile
          def sha(raw): return hashlib.sha256(raw).hexdigest()
          packet=pathlib.Path("current/fixtures/cnr-001-evidence/cnr001-v7.tar.gz")
          if sha(packet.read_bytes())!="03327a365b76474bfaf0956eb06766cabdf9de02e5ca1162c0c1474f9d893288":
              raise RuntimeError("v7 external archive identity differs")
          with tarfile.open(packet,"r:gz") as tar:
              members=tar.getmembers()
              if len(members)!=6 or any(not x.isfile() for x in members) or len({x.name for x in members})!=6:
                  raise RuntimeError("invalid historical v7 file inventory")
              retained={x.name:tar.extractfile(x).read() for x in members}
          names={"MANIFEST.json","v7/cnr-request.json","v7/cnr-analysis.json",
                 "v7/cnr-freeze-receipt.json","v7/cnr-run-receipt.json","v7/cnr-verification.json"}
          if set(retained)!=names: raise RuntimeError("historical v7 members missing")
          from pathlib import Path
          sys.path.insert(0,str(Path("v7-producer/src").resolve()))
          from trinite.contracts import json_bytes
          manifest=json.loads(retained["MANIFEST.json"])
          if (retained["MANIFEST.json"]!=json_bytes(manifest)
                  or manifest["schema"]!="trinite.cnr-001-evidence-archive.v7"
                  or manifest["parent_v6_sha256"]!="86cb1be634f41cceabb7f1b49c5b5d4803b5a182ca04167b27ff96aea36a0aa4"
                  or set(manifest["entries"])!=names-{"MANIFEST.json"}):
              raise RuntimeError("historical v7 manifest or parent commitment invalid")
          for name,attrs in manifest["entries"].items():
              if attrs!={"bytes":len(retained[name]),"sha256":sha(retained[name])}:
                  raise RuntimeError("historical v7 member differs: "+name)
          req=retained["v7/cnr-request.json"]
          analysis=retained["v7/cnr-analysis.json"]
          rid="sha256:"+sha(req)
          aid="sha256:"+sha(analysis)
          if manifest["request_identity"]!=rid or manifest["analysis_identity"]!=aid:
              raise RuntimeError("historical v7 request/analysis identities differ")
          with tempfile.TemporaryDirectory() as tmp:
              rp=pathlib.Path(tmp)/"request.json"
              ap=pathlib.Path(tmp)/"analysis.json"
              rp.write_bytes(req)
              ap.write_bytes(analysis)
              producer=pathlib.Path("v7-producer").resolve()
              env=dict(os.environ,PYTHONPATH=str(producer/"src"))
              args=[sys.executable,"scripts/run_cnr001.py","--verify-only",
                    "--request",str(rp),"--request-identity",rid,
                    "--output",str(ap),"--analysis-identity",aid]
              checked=subprocess.run(args,cwd=producer,env=env,capture_output=True,timeout=240)
              if checked.returncode!=0:
                  raise RuntimeError("original v7 native replay failed: "+checked.stderr.decode(errors="replace")[-1600:])
              if checked.stdout!=retained["v7/cnr-verification.json"]:
                  raise RuntimeError("fresh v7 verifier receipt differs from archived receipt")
              if rp.read_bytes()!=req or ap.read_bytes()!=analysis:
                  raise RuntimeError("v7 verification mutated original run bytes")
          print("Full v7 verifier executed against pinned producer bda46a5; original request, analysis, receipt and archive identities match.")
          PY

  historical-v8-replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: current
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: cc996e272800a5c02667001f7c96c8d11cb513cc
          path: v8-producer
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install original hash-locked authentic CNR reader
        working-directory: v8-producer
        run: python -m pip install --require-hashes --no-deps -r requirements.connectome.lock
      - name: Replay authenticated v8 request and analysis with exact original producer
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' 2>&1 | tee "$RUNNER_TEMP/cnr-historical-v8.log"
          import hashlib, json, os, pathlib, subprocess, sys, tarfile, tempfile
          def sha(raw): return hashlib.sha256(raw).hexdigest()
          packet=pathlib.Path("current/fixtures/cnr-001-evidence/cnr001-v8.tar.gz")
          if sha(packet.read_bytes())!="718e5fec4674ab615b4162a956500b0bc245e25f15153770a5bfa4e6f7d72b42":
              raise RuntimeError("v8 external archive identity differs")
          sidecar=packet.with_name("cnr001-v8.sha256")
          if sidecar.read_text("ascii")!="718e5fec4674ab615b4162a956500b0bc245e25f15153770a5bfa4e6f7d72b42  cnr001-v8.tar.gz\n":
              raise RuntimeError("immutable v8 sidecar differs")
          with tarfile.open(packet,"r:gz") as tar:
              members=tar.getmembers()
              if len(members)!=6 or any(not x.isfile() for x in members) or len({x.name for x in members})!=6:
                  raise RuntimeError("invalid historical v8 file inventory")
              retained={x.name:tar.extractfile(x).read() for x in members}
          names={"MANIFEST.json","v8/cnr-request.json","v8/cnr-analysis.json",
                 "v8/cnr-freeze-receipt.json","v8/cnr-run-receipt.json","v8/cnr-verification.json"}
          if set(retained)!=names: raise RuntimeError("historical v8 members missing")
          from pathlib import Path
          sys.path.insert(0,str(Path("v8-producer/src").resolve()))
          from trinite.contracts import json_bytes
          manifest=json.loads(retained["MANIFEST.json"])
          if (retained["MANIFEST.json"]!=json_bytes(manifest)
                  or manifest["schema"]!="trinite.cnr-001-evidence-archive.v8"
                  or manifest["parent_v7_sha256"]!="03327a365b76474bfaf0956eb06766cabdf9de02e5ca1162c0c1474f9d893288"
                  or set(manifest["entries"])!=names-{"MANIFEST.json"}):
              raise RuntimeError("historical v8 manifest or parent commitment invalid")
          for name,attrs in manifest["entries"].items():
              if attrs!={"bytes":len(retained[name]),"sha256":sha(retained[name])}:
                  raise RuntimeError("historical v8 member differs: "+name)
          req=retained["v8/cnr-request.json"]
          analysis=retained["v8/cnr-analysis.json"]
          rid="sha256:"+sha(req)
          aid="sha256:"+sha(analysis)
          if manifest["request_identity"]!=rid or manifest["analysis_identity"]!=aid:
              raise RuntimeError("historical v8 request/analysis identities differ")
          with tempfile.TemporaryDirectory() as tmp:
              rp=pathlib.Path(tmp)/"request.json"
              ap=pathlib.Path(tmp)/"analysis.json"
              rp.write_bytes(req)
              ap.write_bytes(analysis)
              producer=pathlib.Path("v8-producer").resolve()
              env=dict(os.environ,PYTHONPATH=str(producer/"src"))
              args=[sys.executable,"scripts/run_cnr001.py","--verify-only",
                    "--request",str(rp),"--request-identity",rid,
                    "--output",str(ap),"--analysis-identity",aid]
              checked=subprocess.run(args,cwd=producer,env=env,capture_output=True,timeout=240)
              if checked.returncode!=0:
                  raise RuntimeError("original v8 native replay failed: "+checked.stderr.decode(errors="replace")[-1600:])
              if checked.stdout!=retained["v8/cnr-verification.json"]:
                  raise RuntimeError("fresh v8 verifier receipt differs from archived receipt")
              if rp.read_bytes()!=req or ap.read_bytes()!=analysis:
                  raise RuntimeError("v8 verification mutated original run bytes")
          print("Full v8 verifier executed against pinned producer cc996e2; original request, analysis, receipt and archive identities match.")
          PY

      - name: Retain historical v8 replay log including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cnr-001-historical-v8-replay
          path: ${{ runner.temp }}/cnr-historical-v8.log
          if-no-files-found: warn

