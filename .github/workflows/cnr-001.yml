name: CNR-001 connectome and ETQ comparison

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cnr-001-${{ github.ref }}
  cancel-in-progress: true

jobs:
  retrospective-graph-comparison:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONPATH: src
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Acquire hash-locked isolated biological Parquet reader
        run: |
          python -m pip install --require-hashes --no-deps -r requirements.connectome.lock
          python -c "import importlib.metadata; assert importlib.metadata.version('pyarrow') == '21.0.0'"
      - name: Build and install wheel at the package boundary
        run: |
          python -m pip install setuptools==84.0.0
          python -m unittest discover -s tests/packaging -v 2>&1 | tee "$RUNNER_TEMP/cnr-wheel-tests.log"
      - name: Run bounded native-baseline/CNR experiment and verify exact replay
        run: |
          python -m unittest discover -s tests -p 'test_cnr001.py' -v 2>&1 | tee "$RUNNER_TEMP/cnr-standardlib-tests.log"
          python -m unittest discover -s tests/cnr -v 2>&1 | tee "$RUNNER_TEMP/cnr-real-data-tests.log"
          python scripts/run_cnr001.py --freeze-request "$RUNNER_TEMP/cnr-request.json" > "$RUNNER_TEMP/cnr-freeze-receipt.json" 2> "$RUNNER_TEMP/cnr-freeze.log"
          REQUEST=$(python -c "import json,os; print(json.load(open(os.environ['RUNNER_TEMP']+'/cnr-freeze-receipt.json'))['request_identity'])")
          python scripts/run_cnr001.py --run --request "$RUNNER_TEMP/cnr-request.json" --request-identity "$REQUEST" --output "$RUNNER_TEMP/cnr-analysis.json" > "$RUNNER_TEMP/cnr-run-receipt.json" 2> "$RUNNER_TEMP/cnr-run.log"
          ANALYSIS=$(python -c "import json,os; print(json.load(open(os.environ['RUNNER_TEMP']+'/cnr-run-receipt.json'))['analysis_identity'])")
          python scripts/run_cnr001.py --verify-only --request "$RUNNER_TEMP/cnr-request.json" --request-identity "$REQUEST" --output "$RUNNER_TEMP/cnr-analysis.json" --analysis-identity "$ANALYSIS" > "$RUNNER_TEMP/cnr-verification.json" 2> "$RUNNER_TEMP/cnr-verification.log"
          python - <<'PY'
          import json, os
          with open(os.environ['RUNNER_TEMP']+'/cnr-analysis.json') as stream: report=json.load(stream)
          print('CNR-001 retrospective results; not independent model generalization:')
          for layer, record in report['layers'].items():
              print(layer)
              for name, arm in record['arms'].items():
                  print(f"  {name:35s}: hops={arm['graph_hops_sum']:3d}; adjacent={arm['same_or_adjacent']}/8; collisions={arm['anchor_collisions']}")
          print('ETQ-303 full walk/event:',report['graph_provenance']['etq_diagnostics'])
          print('v0.1.0 baseline:',report['baseline'])
          PY
      - name: Verify immutable v4 packet and compare native numerical outcomes
        if: success()
        run: |
          python - <<'PY'
          import hashlib, json, os, tarfile
          from pathlib import Path
          def sha(raw): return hashlib.sha256(raw).hexdigest()
          historical = Path("fixtures/cnr-001-evidence/cnr001-v1-v2.tar.gz").read_bytes()
          if sha(historical) != "be7ec8ade4c19c05bff5f11741a2b48b4a7760e8ec8fa811c263a021354f18df":
              raise RuntimeError("historical CNR v1/v2 packet identity changed")
          archived = Path("fixtures/cnr-001-evidence/cnr001-v4.tar.gz").read_bytes()
          if sha(archived) != "95d16ee195270aa9d41d08be1b63382ae9db804f9306cb2791740f81c0b733a4":
              raise RuntimeError("published v4 archive identity changed")
          with tarfile.open("fixtures/cnr-001-evidence/cnr001-v4.tar.gz", "r:gz") as tar:
              members = tar.getmembers()
              if any(not m.isfile() for m in members) or len({m.name for m in members}) != len(members):
                  raise RuntimeError("malformed retained v4 archive")
              contents = {m.name:tar.extractfile(m).read() for m in members}
          manifest = json.loads(contents["MANIFEST.json"])
          if (manifest["historical_v1_v2_sha256"] != sha(historical)
                  or set(manifest["entries"]) != set(contents)-{"MANIFEST.json"}):
              raise RuntimeError("v4 archival member inventory differs")
          for name, expected in manifest["entries"].items():
              if sha(contents[name]) != expected["sha256"] or len(contents[name]) != expected["bytes"]:
                  raise RuntimeError("v4 archival member identity differs: " + name)
          # Historical requests bind their entire source tree. Any later, unrelated
          # first-party module correctly changes the new run's request and source
          # identities: those are NEVER overwritten, patched or claimed equal.
          frozen = json.loads(contents["v4/cnr-analysis.json"])
          current = json.loads((Path(os.environ["RUNNER_TEMP"])/"cnr-analysis.json").read_bytes())
          if (frozen["schema"] != "trinite.cnr-001-analysis.v4"
                  or current["schema"] != frozen["schema"]
                  or current["protocol_identity"] != frozen["protocol_identity"]):
              raise RuntimeError("CNR v4 protocol mismatch")
          # These two fields MUST remain source/run-specific, not normalized in
          # persistent evidence. The scientific/numeric observation is compared
          # exhaustively over every remaining field, not a few headline scores.
          nonnumerical = {"source", "request_identity"}
          old_values = {k:v for k,v in frozen.items() if k not in nonnumerical}
          new_values = {k:v for k,v in current.items() if k not in nonnumerical}
          if old_values != new_values:
              raise RuntimeError("CNR current verified numerical results disagree with historical v4")
          print("Historical CNR v4 archive SHA256 verified, all committed members exact.")
          print("Fresh source-bound CNR report independently verified and all stable numerical fields agree.")
          print("Historical and current request/source identities remain distinct; original archive untouched.")
          PY
      - name: Retain all research results, including failure logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cnr-001-retrospective-reports
          path: |
            ${{ runner.temp }}/cnr-*.json
            ${{ runner.temp }}/cnr-*.log
          if-no-files-found: warn
          retention-days: 90

  historical-v3-replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONPATH: src
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: c9f4399eca3bb380136321453ff2c6222f0bbaec
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Replay unchanged v3 archive with its original producer
        run: |
          python -m pip install --require-hashes --no-deps -r requirements.connectome.lock
          python - <<'PYCODE' 2>&1 | tee "$RUNNER_TEMP/cnr-historical-v3.log"
          import hashlib, importlib.util, os, tarfile
          from pathlib import Path
          from trinite.contracts import identity, json_bytes
          packet = Path("fixtures/cnr-001-evidence/cnr001-v3.tar.gz").read_bytes()
          assert hashlib.sha256(packet).hexdigest() == "fcec1f268a3985aeb921899d2cfcd8886ec91d53598faa6184761eb800a5ef5a"
          spec = importlib.util.spec_from_file_location("cnr_v3", "scripts/run_cnr001.py")
          runner = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(runner)
          with tarfile.open("fixtures/cnr-001-evidence/cnr001-v3.tar.gz", "r:gz") as archive:
              request = archive.extractfile("v3/cnr-request.json").read()
              analysis = archive.extractfile("v3/cnr-analysis.json").read()
              receipt = archive.extractfile("v3/cnr-verification.json").read()
          root = Path(os.environ["RUNNER_TEMP"])
          rpath, apath = root / "v3-request.json", root / "v3-analysis.json"
          rpath.write_bytes(request)
          apath.write_bytes(analysis)
          got = runner.verify(rpath, identity(request), apath, identity(analysis))
          assert json_bytes(got) == receipt
          assert rpath.read_bytes() == request and apath.read_bytes() == analysis
          print("Original v3 request, analysis and verification receipt replay exactly; inputs unchanged.")
          PYCODE
      - name: Retain historical replay log including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cnr-001-historical-v3-replay
          path: ${{ runner.temp }}/cnr-historical-v3.log
          if-no-files-found: warn
