name: CNR-001 connectome and ETQ comparison

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cnr-001-${{ github.ref }}
  cancel-in-progress: true

jobs:
  retrospective-graph-comparison:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONPATH: src
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Acquire hash-locked isolated biological Parquet reader
        run: |
          python -m pip install --require-hashes --no-deps -r requirements.connectome.lock
          python -c "import importlib.metadata; assert importlib.metadata.version('pyarrow') == '21.0.0'"
      - name: Run bounded native-baseline/CNR experiment and verify exact replay
        run: |
          python -m unittest discover -s tests -p 'test_cnr001.py' -v
          python scripts/run_cnr001.py --freeze-request "$RUNNER_TEMP/cnr-request.json" > "$RUNNER_TEMP/cnr-freeze-receipt.json"
          REQUEST=$(python -c "import json,os; print(json.load(open(os.environ['RUNNER_TEMP']+'/cnr-freeze-receipt.json'))['request_identity'])")
          python scripts/run_cnr001.py --run --request "$RUNNER_TEMP/cnr-request.json" --request-identity "$REQUEST" --output "$RUNNER_TEMP/cnr-analysis.json" > "$RUNNER_TEMP/cnr-run-receipt.json"
          ANALYSIS=$(python -c "import json,os; print(json.load(open(os.environ['RUNNER_TEMP']+'/cnr-run-receipt.json'))['analysis_identity'])")
          python scripts/run_cnr001.py --verify-only --request "$RUNNER_TEMP/cnr-request.json" --request-identity "$REQUEST" --output "$RUNNER_TEMP/cnr-analysis.json" --analysis-identity "$ANALYSIS" > "$RUNNER_TEMP/cnr-verification.json"
          python - <<'PY'
          import json, os
          with open(os.environ['RUNNER_TEMP']+'/cnr-analysis.json') as stream: report=json.load(stream)
          print('CNR-001 retrospective results; not independent model generalization:')
          for layer, record in report['layers'].items():
              print(layer)
              for name, arm in record['arms'].items():
                  print(f"  {name:35s}: hops={arm['graph_hops_sum']:3d}; adjacent={arm['same_or_adjacent']}/8; collisions={arm['anchor_collisions']}")
          print('ETQ-303 full walk/event:',report['graph_provenance']['etq_diagnostics'])
          print('v0.1.0 baseline:',report['baseline'])
          PY
          cp "$RUNNER_TEMP/cnr-request.json" cnr-request.json
          cp "$RUNNER_TEMP/cnr-analysis.json" cnr-analysis.json
          cp "$RUNNER_TEMP/cnr-freeze-receipt.json" cnr-freeze-receipt.json
          cp "$RUNNER_TEMP/cnr-run-receipt.json" cnr-run-receipt.json
          cp "$RUNNER_TEMP/cnr-verification.json" cnr-verification.json
      - name: Retain all research results, including failure logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cnr-001-retrospective-reports
          path: |
            cnr-request.json
            cnr-analysis.json
            cnr-freeze-receipt.json
            cnr-run-receipt.json
            cnr-verification.json
          if-no-files-found: warn
          retention-days: 90
