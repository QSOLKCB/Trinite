name: CNR-001 connectome and ETQ comparison

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cnr-001-${{ github.ref }}
  cancel-in-progress: true

jobs:
  retrospective-graph-comparison:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONPATH: src
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Acquire hash-locked isolated biological Parquet reader
        run: |
          python -m pip install --require-hashes --no-deps -r requirements.connectome.lock
          python -c "import importlib.metadata; assert importlib.metadata.version('pyarrow') == '21.0.0'"
      - name: Build and install wheel at the package boundary
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install setuptools==84.0.0
          python -m unittest discover -s tests/packaging -v 2>&1 | tee "$RUNNER_TEMP/cnr-wheel-tests.log"
      # Only the missing-packet bootstrap emits candidate bytes; the following
      # strict tests still fail until the independently committed v6 packet and
      # its externally recorded checksum exist. No historical bytes are altered.
      - name: Emit prospectively source-bound v6 candidate when missing
        shell: bash
        run: |
          set -euo pipefail
          if [ -e fixtures/cnr-001-evidence/cnr001-v6.tar.gz ]; then
            echo 'v6 evidence packet already retained; test its full exact replay.'
          else
            python - <<'PY'
          import base64, gzip, hashlib, io, json, os, tarfile, tempfile
          from pathlib import Path
          from trinite.contracts import identity, json_bytes, parse_json
          from scripts import run_cnr001 as runner

          def sha(raw):
              return hashlib.sha256(raw).hexdigest()

          root = Path(tempfile.mkdtemp(prefix="cnr001-v6-candidate-"))
          req, analysis = root/"cnr-request.json", root/"cnr-analysis.json"
          frozen = runner.freeze(req)
          ran = runner.run(req, frozen["request_identity"], analysis)
          checked = runner.verify(req, frozen["request_identity"], analysis,
                                  ran["analysis_identity"])
          if checked["status"] != "passed" or not checked["read_only"]:
              raise RuntimeError("new CNR v6 candidate failed authentic source-bound replay")
          # Inspect the actual mismatch, not an inferred or silently resealed ID.
          with tarfile.open("fixtures/cnr-001-evidence/cnr001-v5.tar.gz", "r:gz") as tar:
              archived = parse_json(tar.extractfile("v5/cnr-request.json").read(), canonical=True)
          fresh = parse_json(req.read_bytes(), canonical=True)
          if set(fresh) != set(archived) or {
              k:v for k,v in fresh.items() if k != "source"
          } != {k:v for k,v in archived.items() if k != "source"}:
              raise RuntimeError("CNR protocol/data change beyond expected source receipt")
          oldsource, newsource = archived["source"], fresh["source"]
          print("CNR_V6_CHANGED_SOURCE_KEYS:" + json.dumps({
              "added": sorted(set(newsource)-set(oldsource)),
              "removed": sorted(set(oldsource)-set(newsource)),
              "modified": sorted(k for k in set(oldsource)&set(newsource)
                                 if oldsource[k] != newsource[k])}, sort_keys=True))
          parent_v5 = Path("fixtures/cnr-001-evidence/cnr001-v5.tar.gz").read_bytes()
          if sha(parent_v5) != "03e735f1101d26f935134ff9fe3f95fce43d6e40b2a03e0f9de0136305ee2144":
              raise RuntimeError("historical parent archive changed")
          items = {
              "v6/cnr-request.json": req.read_bytes(),
              "v6/cnr-analysis.json": analysis.read_bytes(),
              "v6/cnr-freeze-receipt.json": json_bytes(frozen),
              "v6/cnr-run-receipt.json": json_bytes(ran),
              "v6/cnr-verification.json": json_bytes(checked),
          }
          manifest = {
              "schema": "trinite.cnr-001-evidence-archive.v6",
              "parent_v5_sha256": sha(parent_v5),
              "source_procedure": "unchanged CNR v5 protocol, new source-bound producer",
              "request_identity": frozen["request_identity"],
              "analysis_identity": ran["analysis_identity"],
              "entries": {name: {"bytes": len(raw), "sha256": sha(raw)}
                          for name, raw in sorted(items.items())},
          }
          items["MANIFEST.json"] = json_bytes(manifest)
          out = io.BytesIO()
          with gzip.GzipFile(fileobj=out,mode="wb",mtime=0,filename="") as gz:
              with tarfile.open(fileobj=gz,mode="w|") as tar:
                  for name, raw in sorted(items.items()):
                      member = tarfile.TarInfo(name)
                      member.size=len(raw); member.mtime=0
                      member.mode=0o644; member.uid=member.gid=0
                      member.uname=member.gname=""
                      tar.addfile(member, io.BytesIO(raw))
          candidate = out.getvalue()
          print("CNR_V6_ARCHIVE_SHA256:" + sha(candidate))
          print("CNR_V6_ARCHIVE_BYTES:" + str(len(candidate)))
          print("CNR_V6_ARCHIVE_BASE64:" + base64.b64encode(candidate).decode("ascii"))
          PY
          fi
      - name: Run bounded native-baseline/CNR experiment and verify exact replay
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_cnr001.py' -v 2>&1 | tee "$RUNNER_TEMP/cnr-standardlib-tests.log"
          python -m unittest discover -s tests/cnr -v 2>&1 | tee "$RUNNER_TEMP/cnr-real-data-tests.log"
          python scripts/run_cnr001.py --freeze-request "$RUNNER_TEMP/cnr-request.json" > "$RUNNER_TEMP/cnr-freeze-receipt.json" 2> "$RUNNER_TEMP/cnr-freeze.log"
          REQUEST=$(python -c "import json,os; print(json.load(open(os.environ['RUNNER_TEMP']+'/cnr-freeze-receipt.json'))['request_identity'])")
          python scripts/run_cnr001.py --run --request "$RUNNER_TEMP/cnr-request.json" --request-identity "$REQUEST" --output "$RUNNER_TEMP/cnr-analysis.json" > "$RUNNER_TEMP/cnr-run-receipt.json" 2> "$RUNNER_TEMP/cnr-run.log"
          ANALYSIS=$(python -c "import json,os; print(json.load(open(os.environ['RUNNER_TEMP']+'/cnr-run-receipt.json'))['analysis_identity'])")
          python scripts/run_cnr001.py --verify-only --request "$RUNNER_TEMP/cnr-request.json" --request-identity "$REQUEST" --output "$RUNNER_TEMP/cnr-analysis.json" --analysis-identity "$ANALYSIS" > "$RUNNER_TEMP/cnr-verification.json" 2> "$RUNNER_TEMP/cnr-verification.log"
          python - <<'PY'
          import json, os
          with open(os.environ['RUNNER_TEMP']+'/cnr-analysis.json') as stream: report=json.load(stream)
          print('CNR-001 retrospective results; not independent model generalization:')
          for layer, record in report['layers'].items():
              print(layer)
              for name, arm in record['arms'].items():
                  print(f"  {name:35s}: hops={arm['graph_hops_sum']:3d}; adjacent={arm['same_or_adjacent']}/8; collisions={arm['anchor_collisions']}")
          print('ETQ-303 full walk/event:',report['graph_provenance']['etq_diagnostics'])
          print('v0.1.0 baseline:',report['baseline'])
          PY
      - name: Verify immutable v5 and source-bound v6 packet byte-for-byte
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os, tarfile
          from pathlib import Path
          from trinite.contracts import json_bytes
          def sha(raw): return hashlib.sha256(raw).hexdigest()

          root = Path("fixtures/cnr-001-evidence")
          old_bytes = (root/"cnr001-v1-v2.tar.gz").read_bytes()
          old_v4 = (root/"cnr001-v4.tar.gz").read_bytes()
          if sha(old_v4) != "95d16ee195270aa9d41d08be1b63382ae9db804f9306cb2791740f81c0b733a4":
              raise RuntimeError("historical v4 archive changed")
          old_v5 = (root/"cnr001-v5.tar.gz").read_bytes()
          if sha(old_bytes) != "be7ec8ade4c19c05bff5f11741a2b48b4a7760e8ec8fa811c263a021354f18df":
              raise RuntimeError("historical v1/v2 archive changed")
          if sha(old_v5) != "03e735f1101d26f935134ff9fe3f95fce43d6e40b2a03e0f9de0136305ee2144":
              raise RuntimeError("historical v5 archive changed")
          current_zip = (root/"cnr001-v6.tar.gz").read_bytes()
          expected = (root/"cnr001-v6.sha256").read_text("ascii").strip().split()
          if len(expected) != 2 or expected[1] != "cnr001-v6.tar.gz" or sha(current_zip) != expected[0]:
              raise RuntimeError("v6 retained external archive digest mismatch")
          with tarfile.open(root/"cnr001-v6.tar.gz", "r:gz") as tar:
              members=tar.getmembers()
              if any(not m.isfile() for m in members) or len({m.name for m in members}) != len(members):
                  raise RuntimeError("malformed v6 archive inventory")
              contents={m.name:tar.extractfile(m).read() for m in members}
          required={"MANIFEST.json", "v6/cnr-request.json",
                    "v6/cnr-analysis.json","v6/cnr-freeze-receipt.json",
                    "v6/cnr-run-receipt.json","v6/cnr-verification.json"}
          if set(contents) != required:
              raise RuntimeError("v6 archive has missing or extra members")
          manifest=json.loads(contents["MANIFEST.json"])
          if (manifest["schema"] != "trinite.cnr-001-evidence-archive.v6"
                  or manifest["parent_v5_sha256"] != sha(old_v5)
                  or set(manifest["entries"]) != required-{"MANIFEST.json"}
                  or contents["MANIFEST.json"] != json_bytes(manifest)):
              raise RuntimeError("v6 canonical manifest and historical ancestry mismatch")
          for name, attrs in manifest["entries"].items():
              raw=contents[name]
              if attrs != {"sha256":sha(raw),"bytes":len(raw)}:
                  raise RuntimeError("v6 member identity/size mismatch: " + name)
          temp=Path(os.environ["RUNNER_TEMP"])
          files=("cnr-request.json","cnr-analysis.json","cnr-freeze-receipt.json",
                 "cnr-run-receipt.json","cnr-verification.json")
          for name in files:
              if contents["v6/"+name] != (temp/name).read_bytes():
                  raise RuntimeError("v6 source-bound producer replay mismatch: " + name)
          if (manifest["request_identity"] != "sha256:"+sha(contents["v6/cnr-request.json"])
                  or manifest["analysis_identity"] != "sha256:"+sha(contents["v6/cnr-analysis.json"])):
              raise RuntimeError("v6 independent commitment identity mismatch")
          print("Historical v5 archive remains immutable; all new v6 request/analysis/receipts exactly match current verified producer.")
          PY
      - name: Retain all research results, including failure logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cnr-001-retrospective-reports
          path: |
            ${{ runner.temp }}/cnr-*.json
            ${{ runner.temp }}/cnr-*.log
          if-no-files-found: warn
          retention-days: 90

  historical-v3-replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONPATH: src
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: c9f4399eca3bb380136321453ff2c6222f0bbaec
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Replay unchanged v3 archive with its original producer
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --require-hashes --no-deps -r requirements.connectome.lock
          python - <<'PYCODE' 2>&1 | tee "$RUNNER_TEMP/cnr-historical-v3.log"
          import hashlib, importlib.util, os, tarfile
          from pathlib import Path
          from trinite.contracts import identity, json_bytes
          packet = Path("fixtures/cnr-001-evidence/cnr001-v3.tar.gz").read_bytes()
          assert hashlib.sha256(packet).hexdigest() == "fcec1f268a3985aeb921899d2cfcd8886ec91d53598faa6184761eb800a5ef5a"
          spec = importlib.util.spec_from_file_location("cnr_v3", "scripts/run_cnr001.py")
          runner = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(runner)
          with tarfile.open("fixtures/cnr-001-evidence/cnr001-v3.tar.gz", "r:gz") as archive:
              request = archive.extractfile("v3/cnr-request.json").read()
              analysis = archive.extractfile("v3/cnr-analysis.json").read()
              receipt = archive.extractfile("v3/cnr-verification.json").read()
          root = Path(os.environ["RUNNER_TEMP"])
          rpath, apath = root / "v3-request.json", root / "v3-analysis.json"
          rpath.write_bytes(request)
          apath.write_bytes(analysis)
          got = runner.verify(rpath, identity(request), apath, identity(analysis))
          assert json_bytes(got) == receipt
          assert rpath.read_bytes() == request and apath.read_bytes() == analysis
          print("Original v3 request, analysis and verification receipt replay exactly; inputs unchanged.")
          PYCODE
      - name: Retain historical replay log including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cnr-001-historical-v3-replay
          path: ${{ runner.temp }}/cnr-historical-v3.log
          if-no-files-found: warn
