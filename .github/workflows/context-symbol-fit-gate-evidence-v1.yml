name: Context symbol fit-gate negative evidence replay
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  portable-readonly-replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Replay deposited stopped custody, data and summary without training
        run: |
          python -B docs/evidence/context-symbol-learning-v1-fit-gate-578d4793/verify.py
          python -B docs/evidence/context-symbol-learning-v1-fit-gate-578d4793/test_verifier.py -v
          git diff --exit-code
      # No optimizer steps, native model loading, heldout disclosure or run/resume.
