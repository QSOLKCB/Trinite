name: Controlled musical pitch replacement conformance
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: music-pitch-intervention-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    env:
      PYTHONPATH: src:scripts
      PYTHONDONTWRITEBYTECODE: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Exact pinned CPU dependencies
        run: |
          python -m pip install --require-hashes --no-deps -r requirements.lock
          python -m pip check
      - name: Prospective data, exposure, scoring and bounded controller contracts
        run: |
          python -B -m unittest discover -s tests/music_pitch_intervention_v1 -v
          python -O -B -m unittest discover -s tests/music_pitch_intervention_v1 -v
          python -I -B scripts/run_music_pitch_intervention.py preflight
      - name: Synthetic native mechanics only, never the target study
        run: |
          python -B -m unittest discover -s tests/music_pitch_intervention_native -v
          python -O -B -m unittest discover -s tests/music_pitch_intervention_native -v
      - name: Preserve both historical result boundaries
        run: |
          python -B -m unittest discover -s tests/music_exposure_result_v1 -v
          python -I -B scripts/check_frozen_music_eval_result.py
          python -B -m unittest discover -s tests/frozen_music_eval_result_v1 -v
          git diff --exit-code
      # No production640-update cell, target development decode, training run or study matrix.
