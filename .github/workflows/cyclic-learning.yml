name: Cyclic representation learning conformance
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cyclic-learning-${{ github.ref }}
  cancel-in-progress: true
jobs:
  exact-and-matched-cpu:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    env:
      PYTHONPATH: src:scripts
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Acquire hash-locked CPU environment
        run: |
          python -m pip install --require-hashes --no-deps -r requirements.lock
          python -m pip check
      - name: Exact oracles, matching and one-update conformance
        run: python -B -m unittest discover -s tests/cyclic_learning_v1 -v
      - name: Freeze a request without quality evaluation
        run: python -I scripts/run_cyclic_learning.py freeze --request "$RUNNER_TEMP/cyclic-learning-request.json"
      - name: Retain prospective request
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cyclic-learning-request-${{ matrix.python }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cyclic-learning-request.json
          if-no-files-found: warn
          retention-days: 14
