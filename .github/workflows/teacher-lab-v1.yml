name: Teacher Lab TT-001 contracts
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: teacher-lab-v1-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  teacher-lab-v1:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, pinned
        with:
          persist-credentials: false
      - name: Fresh standard-library contracts, normal and optimized
        run: |
          PYTHONPATH=src:scripts python3 -B -m unittest discover -s tests/teacher_lab_v1 -v
          PYTHONPATH=src:scripts python3 -B -O -m unittest discover -s tests/teacher_lab_v1 -v
      - name: Cold preflight, preview, freeze and independently anchored verification
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/teacher_lab.py inspect
          python3 scripts/teacher_lab.py preflight > "$RUNNER_TEMP/teacher-lab-preflight.json"
          python3 scripts/teacher_lab.py preview-formal > "$RUNNER_TEMP/teacher-lab-preview.json"
          python3 scripts/teacher_lab.py freeze --out "$RUNNER_TEMP/teacher-lab-freeze"
          digest="sha256:$(sha256sum "$RUNNER_TEMP/teacher-lab-freeze/request.json" | cut -d' ' -f1)"
          python3 scripts/teacher_lab.py verify --run "$RUNNER_TEMP/teacher-lab-freeze" --identity "$digest"
