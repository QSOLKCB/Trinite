name: Music negative pilot public evidence
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: music-learning-result-${{ github.ref }}
  cancel-in-progress: true
jobs:
  retained-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    env:
      PYTHONPATH: src:scripts
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Exact pinned CPU dependencies
        run: |
          python -m pip install --require-hashes --no-deps -r requirements.lock
          python -m pip check
      - name: Read-only original public scores and adversarial tests
        run: |
          python -B scripts/check_music_learning_result.py
          python -B -m unittest discover -s tests/music_learning_result_v1 -v
          python -O -B -m unittest discover -s tests/music_learning_result_v1 -v
          git diff --exit-code
      # No model construction, training, target inference or optimizer replay.
