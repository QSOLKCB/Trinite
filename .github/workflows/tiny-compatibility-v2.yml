name: Tiny compatibility v2 synthetic contracts
on: [push, pull_request]
permissions:
  contents: read
jobs:
  model-free:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - name: Synthetic contracts, normal and optimized
        run: |
          python -B -m unittest discover -s tests -p 'test_tiny*' -v
          python -B -O -m unittest discover -s tests -p 'test_tiny*' -v
      - name: Offline CLI help, never a native probe
        run: python -I -S -B scripts/run_tiny_compatibility_v2.py --help
