name: Queue learning v1 engineering
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: queue-learning-v1-${{ github.ref }}
  cancel-in-progress: true
jobs:
  conformance:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    env:
      PYTHONPATH: src:scripts
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Build pinned authoritative queue and gate offline
        run: |
          rustup toolchain install 1.90.0 --profile minimal
          (cd external/queue-evaluator-v1 && cargo build --offline --locked --release)
          (cd external/queue-sim-v1 && cargo build --offline --locked --release)
      - name: Leakage, lossless masks, split, admission, budget and actual two-anchor gate
        run: |
          python -B -m unittest discover -s tests/queue_learning_v1 -v
          python -O -B -m unittest discover -s tests/queue_learning_v1 -v
          python -I -B scripts/run_queue_learning_v1.py engineering --out "$RUNNER_TEMP/queue-engineering" --anchors "$RUNNER_TEMP/queue-engineering-anchors"
      - name: Exact hash-locked CPU environment
        run: |
          python -m pip install --require-hashes --no-deps -r requirements.lock
          python -m pip check
      - name: Native safe reader and zero-update feasibility
        run: |
          python -B -m unittest discover -s tests/queue_learning_native -v
          python -I -B scripts/run_queue_learning_v1.py feasibility --out "$RUNNER_TEMP/queue-feasibility"
          git diff --exit-code
      - name: Retain engineering evidence including negative outputs and failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: queue-learning-engineering-python-${{ matrix.python }}
          path: |
            ${{ runner.temp }}/queue-engineering
            ${{ runner.temp }}/queue-engineering-anchors
            ${{ runner.temp }}/queue-feasibility
          if-no-files-found: warn
          retention-days: 30
      # No optimizer update, pilot inference/score, scientific freeze or run.
