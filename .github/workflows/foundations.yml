name: Manual foundations learning adequacy

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  foundations:
    runs-on: ubuntu-24.04
    # 54 workers x 240 seconds = 216 minutes, plus retention headroom.
    timeout-minutes: 240
    env:
      PYTHONPATH: src
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Acquire hash-locked CPU dependencies
        run: |
          python -m pip install --require-hashes --no-deps -r requirements.lock
          python -m pip check
      - name: Freeze current foundations request
        run: python -m trinite freeze-foundations "$RUNNER_TEMP/foundations-request.json" > "$RUNNER_TEMP/foundations-freeze.json"
      - name: Train all cells and apply the verified learning gate
        run: |
          FOUNDATIONS_REQUEST_ID=$(python -c 'import json,os; print(json.load(open(os.environ["RUNNER_TEMP"]+"/foundations-freeze.json"))["request_identity"])')
          python scripts/run_foundations.py --request "$RUNNER_TEMP/foundations-request.json" --request-identity "$FOUNDATIONS_REQUEST_ID" --output "$RUNNER_TEMP/foundations"
      - name: Retain completed, blocked and failed outcomes
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: foundations-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/foundations
            ${{ runner.temp }}/foundations-request.json
            ${{ runner.temp }}/foundations-freeze.json
          if-no-files-found: warn
          retention-days: 14
