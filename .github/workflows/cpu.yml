name: CPU conformance

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cpu-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conformance:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Offline standard-library conformance
        env:
          PYTHONPATH: src
        run: |
          python -m unittest discover -s tests -v
          python -m trinite validate-config configs/reference.json
          python -m trinite audit-fixture fixtures/formal-v1
          python -m trinite generate-fixture "$RUNNER_TEMP/trinite-fixture"
          cmp fixtures/formal-v1/dataset.json "$RUNNER_TEMP/trinite-fixture/dataset.json"
          cmp fixtures/formal-v1/manifest.json "$RUNNER_TEMP/trinite-fixture/manifest.json"
