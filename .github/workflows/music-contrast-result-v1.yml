name: Reports-only musical contrast result preservation
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: music-contrast-result-${{ github.ref }}
  cancel-in-progress: true
jobs:
  report-consistency:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    env:
      PYTHONPATH: src:scripts
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - name: Verify derivative bytes and independently rescored report tokens
        run: |
          python -B scripts/check_music_contrast_result.py
          python -B -m unittest discover -s tests/music_contrast_result_v1 -v
          python -O -B -m unittest discover -s tests/music_contrast_result_v1 -v
          git diff --exit-code
      # Standard library only. No target inference, training or checkpoint loading.
