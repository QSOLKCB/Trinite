name: QEC procedural full research evidence

# Deliberately manual: 4,096 real optimizer updates * four cells, followed by
# independent full numerical replay, separate archival replay and custody check.
# PR CI runs the smaller bounded real-model smoke test separately.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  training-only-matrix:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      PYTHONPATH: src
      PYTHONDONTWRITEBYTECODE: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      RUN_ROOT: /tmp/trinite-procedural-research-v2-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Acquire immutable hash-locked research CPU environment
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --require-hashes --no-deps -r requirements.lock
          python -m pip check
      - name: Freeze new four-cell RESEARCH request on this published source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUN_ROOT"
          git rev-parse HEAD | tee "$RUN_ROOT/producer-commit.txt"
          python scripts/run_procedural_qec.py \
            --freeze-request "$RUN_ROOT/request.json" --run-profile research \
            2>&1 | tee "$RUN_ROOT/freeze.log"
          python -c 'import json,os; p=os.environ["RUN_ROOT"]+"/freeze.log"; x=json.load(open(p)); assert x["run_profile"]=="research" and x["planned_cells"]==4'
      - name: Train both seeds and both arms and retain every outcome
        shell: bash
        run: |
          set -euo pipefail
          REQUEST=$(python -c 'import json,os; print(json.load(open(os.environ["RUN_ROOT"]+"/freeze.log"))["request_identity"])')
          python scripts/run_procedural_qec.py --run \
            --request "$RUN_ROOT/request.json" --request-identity "$REQUEST" \
            --verification-request "$RUN_ROOT/verification-request.json" \
            --output "$RUN_ROOT/run" 2>&1 | tee "$RUN_ROOT/run-receipt.json"
      - name: Independently replay all four native AdamW update trajectories
        shell: bash
        run: |
          set -euo pipefail
          REQUEST=$(python -c 'import json,os; print(json.load(open(os.environ["RUN_ROOT"]+"/freeze.log"))["request_identity"])')
          VERIFY=$(python -c 'import json,os; print(json.load(open(os.environ["RUN_ROOT"]+"/run-receipt.json"))["verification_request_identity"])')
          python scripts/run_procedural_qec.py --verify-only \
            --request "$RUN_ROOT/request.json" --request-identity "$REQUEST" \
            --verification-request "$RUN_ROOT/verification-request.json" \
            --verification-request-identity "$VERIFY" \
            --output "$RUN_ROOT/run" 2>&1 | tee "$RUN_ROOT/read-only-replay.json"
      - name: Publish complete source-bound, lossless evidence outside the run
        shell: bash
        run: |
          set -euo pipefail
          REQUEST=$(python -c 'import json,os; print(json.load(open(os.environ["RUN_ROOT"]+"/freeze.log"))["request_identity"])')
          VERIFY=$(python -c 'import json,os; print(json.load(open(os.environ["RUN_ROOT"]+"/run-receipt.json"))["verification_request_identity"])')
          python scripts/archive_procedural_qec.py --archive \
            --output "$RUN_ROOT/Trinite-procedural-QEC-research-v2.zip" \
            --run "$RUN_ROOT/run" \
            --request "$RUN_ROOT/request.json" --request-identity "$REQUEST" \
            --verification-request "$RUN_ROOT/verification-request.json" \
            --verification-request-identity "$VERIFY" \
            2>&1 | tee "$RUN_ROOT/archive-receipt.json"
          ARCHIVE_ID=$(python -c 'import json,os; print(json.load(open(os.environ["RUN_ROOT"]+"/archive-receipt.json"))["archive_identity"])')
          INVENTORY_ID=$(python -c 'import json,os; print(json.load(open(os.environ["RUN_ROOT"]+"/archive-receipt.json"))["inventory_identity"])')
          python scripts/archive_procedural_qec.py --verify-archive \
            --archive-file "$RUN_ROOT/Trinite-procedural-QEC-research-v2.zip" \
            --archive-identity "$ARCHIVE_ID" --inventory-identity "$INVENTORY_ID" \
            2>&1 | tee "$RUN_ROOT/transport-verification.json"
          (cd "$RUN_ROOT" && sha256sum Trinite-procedural-QEC-research-v2.zip > ARCHIVE-SHA256.txt)
          python - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ["RUN_ROOT"])
          summary = json.loads((root/"run/summary.json").read_text())
          assert summary["run_profile"] == "research" and summary["outcome"] == "completed"
          assert len(summary["cells"]) == 4 and summary["held_out_scored"] is False
          print("Research training-only acceptance:", summary["training_gate_pass"])
          for cell in summary["cells"]:
              report = cell["report"]
              print("seed", cell["seed"], "arm", cell["arm"],
                    "task_failures", report["training_task_failures"],
                    "total_target_tokens", report["target_tokens"])
              for task, score in sorted(report["scores"]["final"]["tasks"].items()):
                  print("  final + EOS", task, score["correct"], "/", score["examples"])
          print("Original folded/composed/held-out/Phase5 gates stay separately blocked.")
          PY
      - name: Retain all outcomes including failed cells and errors
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: trinite-procedural-qec-full-research-v2
          path: /tmp/trinite-procedural-research-v2-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: warn
          retention-days: 90
          compression-level: 6
