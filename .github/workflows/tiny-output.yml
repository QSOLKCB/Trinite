name: Tiny output contracts
on: [push, pull_request]
jobs:
  synthetic-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -B -m unittest discover -s tests -p test_tiny_output.py -v
      - run: python -B -O -m unittest discover -s tests -p test_tiny_output.py -v
      - run: python -I -S scripts/run_tiny_output.py --help
