name: External NCM CPU contracts
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - name: Standard-library contracts and honest adapter doubles
        env:
          PYTHONPATH: scripts
        run: python -B -m unittest discover -s tests/ncm_reference_v1 -v
      - name: Freeze source-bound request without loading a model
        run: python -B scripts/run_ncm_reference.py freeze --output "$RUNNER_TEMP/ncm-request.json"
