name: QEC procedural supervision

on:
  pull_request:
    paths:
      - 'src/trinite/procedural_qec/**'
      - 'scripts/run_procedural_qec.py'
      - 'tests/test_procedural_qec.py'
      - 'tests/procedural_qec/**'
      - '.github/workflows/procedural-qec.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-procedural-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PYTHONPATH: src
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Acquire exact hash-locked CPU dependencies
        run: |
          python -m pip install --require-hashes --no-deps -r requirements.lock
          python -m pip check
      - name: Exact oracle, family and tamper conformance
        run: python -m unittest discover -s tests -p test_procedural_qec.py -v
      - name: Native two-seed two-arm smoke, full replay and read-only verification
        run: python -m unittest discover -s tests/procedural_qec -v
