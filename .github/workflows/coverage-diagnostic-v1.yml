name: Historical coverage diagnostic conformance

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coverage-diagnostic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-subset-and-analysis:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    env:
      PYTHONPATH: src:scripts
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Original-byte subset and coverage analysis controls
        run: python -B -m unittest discover -s tests/coverage_diagnostic_v1 -v
      # Standard library only. No target inference, training, model or numerical dependency download.
