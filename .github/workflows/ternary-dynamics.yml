name: Ternary dynamics diagnostic conformance

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ternary-dynamics-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pinned-cpu-diagnostics:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONPATH: src:scripts
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Acquire exact hash-locked CPU dependencies
        run: |
          python -m pip install --require-hashes --no-deps -r requirements.lock
          python -m pip check
      - name: Read-only ternary dynamics and negative-fixture conformance
        run: |
          python -m unittest discover -s tests/ternary_dynamics -v
          python -m unittest discover -s tests -p test_ternary_dynamics_contract.py -v
