name: Manual three-lane QEC comparison

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  comparison:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONPATH: src
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Acquire hash-locked CPU dependencies
        run: |
          python -m pip install --require-hashes --no-deps -r requirements.lock
          python -m pip check
      - name: Freeze current source, environment and dataset request
        run: python -m trinite freeze-comparison "$RUNNER_TEMP/comparison-request.json" > "$RUNNER_TEMP/comparison-freeze.json"
      - name: Run all 27 cells with separate training and evaluation stages
        run: |
          COMPARISON_REQUEST_ID=$(python -c 'import json,os; print(json.load(open(os.environ["RUNNER_TEMP"]+"/comparison-freeze.json"))["request_identity"])')
          python scripts/run_comparison.py --request "$RUNNER_TEMP/comparison-request.json" --request-identity "$COMPARISON_REQUEST_ID" --output "$RUNNER_TEMP/comparison"
      - name: Retain completed and failed cells
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: three-lane-qec-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/comparison
            ${{ runner.temp }}/comparison-request.json
            ${{ runner.temp }}/comparison-freeze.json
          if-no-files-found: warn
          retention-days: 14
