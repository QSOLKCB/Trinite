name: Prospective model-size policy
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: model-size-policy-${{ github.ref }}
  cancel-in-progress: true
jobs:
  policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    env:
      PYTHONPATH: src:scripts
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Allocation-free policy boundaries
        run: |
          python -S -B -m unittest discover -s tests/model_size_policy_v1 -v
          python -O -S -B -m unittest discover -s tests/model_size_policy_v1 -v
      - name: Exact pinned CPU dependencies
        run: |
          python -m pip install --require-hashes --no-deps -r requirements.lock
          python -m pip check
      - name: Tiny native adapter conformance only
        run: |
          python -B -m unittest discover -s tests/model_size_policy_native -v
          python -O -B -m unittest discover -s tests/model_size_policy_native -v
          git diff --exit-code
