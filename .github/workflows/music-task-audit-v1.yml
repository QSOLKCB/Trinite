name: Training-free musical task support and error audit
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: music-task-audit-${{ github.ref }}
  cancel-in-progress: true
jobs:
  read-only-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    env:
      PYTHONPATH: src:scripts
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - name: Source-bound task support and retained-error audit
        run: |
          python -I -B scripts/check_music_task_audit.py > "$RUNNER_TEMP/music-task-audit.json"
          python -I -B -c 'import json, os; r=json.load(open(os.environ["RUNNER_TEMP"]+"/music-task-audit.json")); print(json.dumps({"schema":r["schema"], "evidence_class":r["evidence_class"], "retained_records":r["analysis"]["retained"]["total_retained_records"], "sections":len(r["analysis"]["retained"]["sections"]), "training_performed":r["training_performed"], "hardware_attested":r["hardware_attested"]}, sort_keys=True))'
          python -B -m unittest discover -s tests/music_task_audit_v1 -v
          python -O -B -m unittest discover -s tests/music_task_audit_v1 -v
      - name: CUDA diagnostic software doubles only
        run: |
          python -B -m unittest discover -s tests/cuda_availability_v1 -v
          python -O -B -m unittest discover -s tests/cuda_availability_v1 -v
      - name: Preserve historical evidence boundaries
        run: |
          python -I -B scripts/check_music_robustness_result.py
          python -I -B scripts/check_music_placement_result.py
          python -I -B scripts/check_music_pitch_result.py
          python -I -B scripts/check_frozen_music_eval_result.py
          git diff --exit-code
      # Standard library only. No model, checkpoint, optimizer or CUDA execution.
