name: Manual training convergence diagnostics

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  convergence:
    runs-on: ubuntu-24.04
    # 27 workers x 240 seconds = 108 minutes, plus retention headroom.
    timeout-minutes: 132
    env:
      PYTHONPATH: src
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Acquire hash-locked CPU dependencies
        run: |
          python -m pip install --require-hashes --no-deps -r requirements.lock
          python -m pip check
      - name: Freeze current training-only convergence request
        run: python scripts/run_convergence.py --freeze-request "$RUNNER_TEMP/convergence-request.json" > "$RUNNER_TEMP/convergence-freeze.json"
      - name: Retain all training-only diagnostic candidates
        run: |
          CONVERGENCE_REQUEST_ID=$(python -c 'import json,os; print(json.load(open(os.environ["RUNNER_TEMP"]+"/convergence-freeze.json"))["request_identity"])')
          python scripts/run_convergence.py --request "$RUNNER_TEMP/convergence-request.json" --request-identity "$CONVERGENCE_REQUEST_ID" --output "$RUNNER_TEMP/convergence"
      - name: Retain completed, blocked and failed outcomes
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: convergence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/convergence
            ${{ runner.temp }}/convergence-request.json
            ${{ runner.temp }}/convergence-freeze.json
          if-no-files-found: warn
          retention-days: 14
