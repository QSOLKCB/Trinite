name: QEC v3 independent-cursor conformance
on:
  pull_request:
    paths:
      - 'src/trinite/procedural_qec_v3/**'
      - 'scripts/run_procedural_qec_v3.py'
      - 'scripts/procedural_qec_v3_archive.py'
      - 'scripts/archive_procedural_qec_v3.py'
      - 'tests/test_procedural_v3_archive.py'
      - '.github/workflows/procedural-qec-v3-research.yml'
      - 'tests/test_procedural_qec_v3.py'
      - 'tests/procedural_qec_v3/**'
      - '.github/workflows/procedural-qec-v3.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  v3-exact-schedule-and-native-replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PYTHONPATH: src
      PYTHONDONTWRITEBYTECODE: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Exact source-bound scheduler and parity regression
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p test_procedural_qec_v3.py -v
      - name: Verify lossless v3 archival contract and hostile packet rejection
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p test_procedural_v3_archive.py -v
      - name: Acquire strictly pinned CPU model dependencies
        run: |
          set -euo pipefail
          python -m pip install --require-hashes --no-deps -r requirements.lock
          python -m pip check
      - name: Native four-cell v3 smoke, closed custody and full replay
        run: |
          set -euo pipefail
          python -m unittest discover -s tests/procedural_qec_v3 -v
