name: Local Ryzen batch evidence archive
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  archive:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - name: Inspect retained bytes without executing models
        env:
          PYTHONPATH: src:scripts
        run: python -B -m unittest discover -s tests -p test_batch_composition_ryzen_evidence.py -v
