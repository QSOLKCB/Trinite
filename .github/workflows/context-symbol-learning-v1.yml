name: Context symbol learning v1 engineering
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  conformance:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONPATH: src:scripts
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Exact CPU environment and context oracle
        run: |
          python -m pip install --require-hashes --no-deps -r requirements.lock
          python -m pip check
          rustup toolchain install 1.90.0 --profile minimal
          python -I -B scripts/run_context_symbol_learning_v1.py build
      - name: Engineering boundaries, software doubles and zero-step native checks
        run: |
          python -B -m unittest discover -s tests/context_symbol_learning_v1 -v
          python -O -B -m unittest discover -s tests/context_symbol_learning_v1 -v
          git diff --exit-code
      # No scientific feasibility/freeze, owner declaration, run or optimizer steps.
