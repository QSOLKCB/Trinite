name: Cyclic learning retained evidence
on: [push, pull_request]
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify retained evidence without numerical dependencies
        run: python -I -S -B scripts/check_cyclic_learning_evidence.py
      - name: Functional regressions, normal and optimized
        run: python -B -m unittest discover -s tests -p test_cyclic_learning_evidence.py -v
