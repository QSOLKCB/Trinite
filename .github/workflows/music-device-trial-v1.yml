name: Matched CPU CUDA trial software conformance
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: music-device-trial-${{ github.ref }}
  cancel-in-progress: true
jobs:
  software-conformance:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONPATH: src:scripts
      PYTHONDONTWRITEBYTECODE: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Stdlib controller, source, admission and unsupported hardware contracts
        run: |
          python -B -m unittest discover -s tests/music_device_trial_v1 -v
          python -O -B -m unittest discover -s tests/music_device_trial_v1 -v
          python -B -m unittest discover -s tests/music_device_trial_runtime -v
          python -O -B -m unittest discover -s tests/music_device_trial_runtime -v
          python -I -B scripts/run_music_device_trial.py preflight
      - name: Canonical CPU dependencies for bounded adapter parity tests only
        run: |
          python -m pip install --require-hashes --no-deps -r requirements.lock
          python -m pip check
      - name: Native CPU versus shared adapter synthetic parity, never target training
        run: |
          python -B -m unittest discover -s tests/music_device_trial_native -v
          python -O -B -m unittest discover -s tests/music_device_trial_native -v
          git diff --exit-code
      - name: State the hardware verification boundary
        run: echo 'Actual CUDA hardware execution is UNRUN in this CPU-only conformance job; doubles and CPU parity do not certify GPU compatibility or speed.'
