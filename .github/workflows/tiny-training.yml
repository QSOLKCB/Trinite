name: Manual tiny training

on:
  workflow_dispatch:
    inputs:
      plan_identity:
        description: 'Exact configs/tiny-training.json SHA-256 identity'
        required: true
        type: string
      dataset_identity:
        description: 'Exact fixtures/formal-v1/dataset.json SHA-256 identity'
        required: true
        type: string

permissions:
  contents: read

jobs:
  paired-training:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        lane: [dense, ternary]
    env:
      PYTHONPATH: src
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      PLAN_IDENTITY: ${{ inputs.plan_identity }}
      DATASET_IDENTITY: ${{ inputs.dataset_identity }}
      SOURCE_REVISION: ${{ github.sha }}
      LANE: ${{ matrix.lane }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Acquire hash-locked CPU dependencies
        run: |
          python -m pip install --require-hashes --no-deps -r requirements.lock
          python -m pip check
      - name: Check caller-supplied immutable inputs
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from trinite.contracts import identity
          from trinite.training import RunConfig
          plan = RunConfig.load('configs/tiny-training.json')
          if plan.content_identity != os.environ['PLAN_IDENTITY']:
              raise SystemExit('plan identity differs from dispatch')
          if identity(Path('fixtures/formal-v1/dataset.json').read_bytes()) != os.environ['DATASET_IDENTITY']:
              raise SystemExit('dataset identity differs from dispatch')
          PY
      - name: Offline bounded training and retained-evidence verification
        run: |
          python -m trinite train "$RUNNER_TEMP/trinite-run" --config configs/tiny-training.json --dataset fixtures/formal-v1 --lane "$LANE" --source-revision "$SOURCE_REVISION"
          python -m trinite verify-observation "$RUNNER_TEMP/trinite-run/provenance"
      - name: Retain completed or failed run files for review
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tiny-training-${{ matrix.lane }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/trinite-run
          if-no-files-found: warn
          retention-days: 14
