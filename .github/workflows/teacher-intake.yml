name: Quarantined teacher intake
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: teacher-intake-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - name: Acquire hash-locked CPU environment
        run: |
          python -m pip install --require-hashes --no-deps -r requirements.lock
          python -m pip check
      - name: Contracts, fake assets and one CPU update only
        run: |
          PYTHONPATH=src:scripts:. python -B -m unittest discover -s tests/teacher_intake_v1 -v
          PYTHONPATH=src:scripts:. python -O -B -m unittest discover -s tests/teacher_intake_v1 -v
