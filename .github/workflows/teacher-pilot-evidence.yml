name: Teacher pilot retained evidence
on: [push, pull_request]
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Offline verification without numerical dependencies
        run: python -I -S -B scripts/check_teacher_pilot_evidence.py
      - name: Functional regressions, normal and optimized
        run: python -B -m unittest discover -s tests -p test_teacher_pilot_evidence.py -v
