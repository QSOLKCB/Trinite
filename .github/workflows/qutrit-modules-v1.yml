name: External qutrit modules v1 conformance
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: qutrit-modules-v1-${{ github.ref }}
  cancel-in-progress: true
jobs:
  rust-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install explicit official Rust toolchain
        run: |
          rustup toolchain install 1.90.0 --profile minimal --component rustfmt --component clippy
          rustc +1.90.0 --version --verbose
          cargo +1.90.0 --version
      - name: Offline locked standalone module conformance
        run: |
          for module in qutrit-decoder-v1 qutrit-sensor-v1; do
            (cd external/"$module" &&
              cargo fmt --all -- --check &&
              cargo clippy --offline --locked --all-targets -- -D warnings &&
              cargo test --offline --locked &&
              cargo test --offline --locked --release &&
              cargo build --offline --locked --release)
          done
          python3 external/qutrit-decoder-v1/tests/oracle.py \
            external/qutrit-decoder-v1/target/release/trinite-qutrit-decoder-v1 \
            external/qutrit-sensor-v1/target/release/trinite-qutrit-sensor-v1
