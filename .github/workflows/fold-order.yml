name: Manual training-only fold order

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fold-order:
    runs-on: ubuntu-24.04
    # 6 x 600s + summary 1200s + reverify 1200s = 100m; 20m headroom.
    timeout-minutes: 120
    env:
      PYTHONPATH: src
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Acquire hash-locked CPU dependencies
        run: |
          python -m pip install --require-hashes --no-deps -r requirements.lock
          python -m pip check
      - name: Freeze current matched request
        run: python scripts/run_fold_order.py --freeze-request "$RUNNER_TEMP/fold-order-request.json" > "$RUNNER_TEMP/fold-order-freeze.json"
      - name: Retain all training-only order candidates
        run: |
          FOLD_REQUEST_ID=$(python -c 'import json,os; print(json.load(open(os.environ["RUNNER_TEMP"]+"/fold-order-freeze.json"))["request_identity"])')
          python scripts/run_fold_order.py --request "$RUNNER_TEMP/fold-order-request.json" --request-identity "$FOLD_REQUEST_ID" --output "$RUNNER_TEMP/fold-order"
      - name: Fresh read-only verification
        run: |
          FOLD_REQUEST_ID=$(python -c 'import json,os; print(json.load(open(os.environ["RUNNER_TEMP"]+"/fold-order-freeze.json"))["request_identity"])')
          python scripts/run_fold_order.py --verify-only --request "$RUNNER_TEMP/fold-order-request.json" --request-identity "$FOLD_REQUEST_ID" --output "$RUNNER_TEMP/fold-order"
      - name: Retain completed, blocked and failed outcomes
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fold-order-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/fold-order
            ${{ runner.temp }}/fold-order-request.json
            ${{ runner.temp }}/fold-order-freeze.json
          if-no-files-found: warn
          retention-days: 14
