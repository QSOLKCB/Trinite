name: Queue learning v2 controller engineering
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: queue-learning-v2-${{ github.ref }}
  cancel-in-progress: true
jobs:
  conformance:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    env:
      PYTHONPATH: src:scripts
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Build pinned authoritative queue and gate offline
        run: |
          rustup toolchain install 1.90.0 --profile minimal
          (cd external/queue-evaluator-v1 && cargo build --offline --locked --release)
          (cd external/queue-sim-v1 && cargo build --offline --locked --release)
      - name: Exact hash-locked CPU environment
        run: |
          python -m pip install --require-hashes --no-deps -r requirements.lock
          python -m pip check
      - name: Mocked v2 lifecycle, resource supervision and preserved native contracts
        run: |
          python -B -m unittest discover -s tests/queue_learning_v2 -v
          python -O -B -m unittest discover -s tests/queue_learning_v2 -v
          python -B -m unittest discover -s tests/queue_learning_diagnostics -v
          python -B -m unittest discover -s tests/queue_learning_native -v
          python -B -m unittest discover -s tests/queue_learning_v1 -v
          git diff --exit-code
      # No scientific freeze, feasibility approval, optimizer updates or run command.
