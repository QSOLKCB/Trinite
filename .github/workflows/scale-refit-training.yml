name: Fixed-code refit training pilot

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: refit-training-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pinned-cpu-refit-training:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    env:
      PYTHONPATH: src:scripts
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Acquire hash-locked CPU dependencies
        run: |
          python -m pip install --require-hashes --no-deps -r requirements.lock
          python -m pip check
      - name: Model, matched update and checkpoint conformance
        run: python -m unittest discover -s tests/scale_refit_training_v1 -v
      - name: Fresh bound pilot and complete replay
        run: |
          request="$RUNNER_TEMP/refit-training-request.json"
          receipt="$RUNNER_TEMP/refit-training-report.json"
          request_id=$(python scripts/run_scale_refit_training.py freeze --request "$request")
          python scripts/run_scale_refit_training.py run --request "$request" --request-identity "$request_id" --output "$receipt" > "$RUNNER_TEMP/refit-run.log" 2>&1
          report_id=$(head -n 1 "$RUNNER_TEMP/refit-run.log")
          python scripts/run_scale_refit_training.py verify --request "$request" --request-identity "$request_id" --output "$receipt" --expected-identity "$report_id"
      - name: Retain completed or failed pilot records
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: refit-training-${{ matrix.python }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/refit-training-*
            ${{ runner.temp }}/refit-run.log
          if-no-files-found: warn
          retention-days: 14
