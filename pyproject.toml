[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "trinite"
version = "0.0.0"
description = "Inspectable edge AI research: offline foundation contracts and fixtures"
readme = "README.md"
requires-python = ">=3.11"
license = "MPL-2.0"
dependencies = []

[project.scripts]
trinite = "trinite.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

